name: verify-install

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PACKAGE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/checkout@v4

      - name: Test guard hook rules
        run: sh tests/guard-test.sh

      - name: Install APM
        run: pip install apm-cli==0.35.0

      - name: Install package into a scratch project
        working-directory: ${{ runner.temp }}
        run: |
          mkdir consumer && cd consumer
          git init -q
          apm install -t claude,codex,cursor "${GITHUB_REPOSITORY}#${PACKAGE_REF}"
          apm compile -t claude,codex,cursor

      - name: Check generated files
        working-directory: ${{ runner.temp }}/consumer
        run: |
          for f in .claude/rules/japanese-response.md .cursor/rules/japanese-response.mdc AGENTS.md; do
            echo "=== $f"
            cat "$f"
            grep -q "日本語で返答する" "$f"
          done
          for s in pdf pptx xlsx ponytail ponytail-review ponytail-audit ponytail-debt ponytail-gain ponytail-help; do
            for d in .claude/skills .agents/skills; do
              test -f "$d/$s/SKILL.md" || { echo "missing $d/$s/SKILL.md"; exit 1; }
            done
          done
          echo "all skills deployed"
          grep -q "notify-on-stop.sh" .claude/settings.json
          grep -q "notify-on-stop.sh" .codex/hooks.json
          test ! -e .cursor/hooks.json  # Cursor は .claude/settings.json のフックを読むため配らない
          sh .claude/hooks/agent-config/scripts/notify-on-stop.sh .claude/hooks/agent-config/scripts/on-agent-complete.wav
          echo "stop hook deployed"
          grep -q "guard.sh" .claude/settings.json
          grep -q "guard.sh" .codex/hooks.json
          sh "$GITHUB_WORKSPACE/tests/guard-test.sh" .claude/hooks/agent-config/scripts/guard.sh
          echo "guard hook deployed"
